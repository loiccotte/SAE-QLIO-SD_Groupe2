<!-- Bandeau gauche : navigation KPI + filtres + infos -->
<aside class="hidden lg:flex flex-col w-56 shrink-0 bg-white border-r border-zinc-200 min-h-[calc(100dvh-60px)] sticky top-[60px]">

    <!-- Navigation KPI -->
    <nav class="p-4 space-y-1">
        <p class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider mb-2 px-2">Indicateurs</p>
        <a href="{{ url_for('main.dashboard') }}"
           class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg transition-colors
                  {% if request.path == '/dashboard' %}bg-zinc-100 text-zinc-900 font-semibold{% else %}text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700{% endif %}">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25a2.25 2.25 0 0 1-2.25-2.25v-2.25Z" /></svg>
            Vue globale
        </a>
        <a href="{{ url_for('main.performance') }}"
           class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg transition-colors
                  {% if request.path == '/performance' %}bg-red-50 text-red-700 font-semibold{% else %}text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700{% endif %}">
            <span class="w-2 h-2 rounded-full bg-[#ff0000]"></span>
            Performance
        </a>
        <a href="{{ url_for('main.qualite') }}"
           class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg transition-colors
                  {% if request.path == '/qualite' %}bg-blue-50 text-blue-700 font-semibold{% else %}text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700{% endif %}">
            <span class="w-2 h-2 rounded-full bg-[#38b6ff]"></span>
            Qualite
        </a>
        <a href="{{ url_for('main.delai') }}"
           class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg transition-colors
                  {% if request.path == '/delai' %}bg-purple-50 text-purple-700 font-semibold{% else %}text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700{% endif %}">
            <span class="w-2 h-2 rounded-full bg-[#f2c0ff]"></span>
            Delai
        </a>
        <a href="{{ url_for('main.energie') }}"
           class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg transition-colors
                  {% if request.path == '/energie' %}bg-green-50 text-green-700 font-semibold{% else %}text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700{% endif %}">
            <span class="w-2 h-2 rounded-full bg-[#09b200]"></span>
            Energie
        </a>
        <a href="{{ url_for('main.stock') }}"
           class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg transition-colors
                  {% if request.path == '/stock' %}bg-zinc-100 text-zinc-900 font-semibold{% else %}text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700{% endif %}">
            <span class="w-2 h-2 rounded-full bg-[#737373]"></span>
            Stock
        </a>
        <a href="{{ url_for('main.carte') }}"
           class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg transition-colors
                  {% if request.path == '/carte' %}bg-zinc-100 text-zinc-900 font-semibold{% else %}text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700{% endif %}">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" /></svg>
            Carte
        </a>
    </nav>

    <!-- Separateur -->
    <div class="mx-4 border-t border-zinc-100"></div>

    <!-- Filtre temporel -->
    {% include 'components/time_filter.html' %}

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Infos utilisateur -->
    <div class="p-4 border-t border-zinc-100">
        <div class="flex items-center gap-2 mb-2">
            <div class="w-7 h-7 rounded-full bg-zinc-200 flex items-center justify-center text-xs font-bold text-zinc-500">
                {{ session.get('name', '?')[0] }}
            </div>
            <div>
                <p class="text-xs font-semibold text-zinc-700">{{ session.get('name', 'Utilisateur') }}</p>
                <p class="text-[10px] text-zinc-400">{{ session.get('role', '') }}</p>
            </div>
        </div>
        <a href="{{ url_for('auth.logout') }}"
           class="block w-full text-center px-3 py-1.5 text-xs font-semibold uppercase tracking-wide
                  bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors border border-zinc-200">
            Deconnexion
        </a>
    </div>
</aside>
